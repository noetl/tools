# noetl/ai-meta#232 — actually run the tests.
#
# Before this workflow, no GitHub Actions workflow in this repo ran `cargo test`
# (nor in noetl/server, noetl/worker, noetl/cli).  The release workflow builds and publishes; nothing executed
# a test.
#
# That is worse than having no tests, because these crates carry hundreds of them
# and they read as a safety net.  A guard no runner executes cannot fail, and a
# guard that cannot fail is indistinguishable from one that was never written —
# which is not hypothetical: adding this workflow to noetl/worker immediately
# surfaced a test that had been asserting a defect closed some time earlier
# (noetl/ai-meta#209), with nobody the wiser.
#
# Deliberately NOT here:
#   * `cargo fmt --check` — these crates are formatted with rustfmt 1.9.0 and a
#     different version reformats large parts of the tree.
# `-D warnings` IS here as of noetl/ai-meta#378.  It was deliberately omitted when
# this workflow was written, because the three pre-existing `question_mark` lints
# in src/arrow_codec.rs would have made it start red for reasons no individual PR
# caused.  Those three are now fixed, so the gate starts green and a new lint is
# the only thing that can turn it red.  There is no allow-list: if one becomes
# necessary, add the entry AND the reason, because an unexplained `-A` is how a
# gate quietly stops gating.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # --all-targets, not the default: plain cargo build/test skip integration
      # tests and cfg(test)-only code, so a binary can be broken while the lib
      # compiles clean.
      #
      # ⚠ --workspace, and it is NOT redundant with --all-targets. The two
      # widen different axes: --all-targets widens TARGET KINDS (lib, bins,
      # tests, examples) within the selected packages; --workspace widens the
      # PACKAGE SELECTION. This repo's root Cargo.toml is a real `[package]`
      # (noetl-tools) as well as a `[workspace]`, so the default selection is
      # that root package ALONE — `noetl-directives` (13 tests) and
      # `noetl-locator` (16) were never built or tested here. Measured: 512
      # before, 541 after.
      #
      # Those two members exist precisely so edge consumers can parse a result
      # locator WITHOUT noetl-tools' heavy graph (duckdb/kube/arrow-flight/
      # tonic/rhai). Their whole value is being usable standalone, which is
      # exactly the property CI was not checking.
      - name: build (all targets)
        run: cargo build --workspace --all-targets --locked

      - name: test
        run: cargo test --workspace --all-targets --locked

      # ⚠ `--all-targets` EXCLUDES doctests, so this repo's doctests were never run
      # by CI -- and one of them had been failing to COMPILE on main
      # (src/tools/shell.rs had example output in an indented block, which rustdoc
      # treats as Rust). `cargo test` locally exited 101 while CI stayed green.
      # A separate --doc run is the only way this gate can see them.
      - name: cargo test --doc
        run: cargo test --workspace --doc --locked

      # Gating since noetl/ai-meta#378.  Proven to fail on a planted lint before
      # the allow-list-free form was committed -- a lint gate that has never been
      # seen to go red is indistinguishable from one that cannot.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
